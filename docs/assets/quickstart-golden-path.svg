<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" font-family="Cairo, 'Noto Sans Arabic', sans-serif" direction="rtl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b263b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" rx="16" fill="url(#bg)"/>
  <text x="480" y="42" text-anchor="middle" fill="#e0e1dd" font-size="22" font-weight="700">الطريق الذهبي — من التثبيت إلى أول Commit في 4 خطوات</text>

  <!-- خط المسار -->
  <line x1="880" y1="150" x2="80" y2="150" stroke="#415a77" stroke-width="4" stroke-linecap="round"/>

  <!-- الخطوة 1: ثبّت (يمين — RTL) -->
  <circle cx="860" cy="150" r="34" fill="#778da9"/>
  <text x="860" y="160" text-anchor="middle" fill="#0d1b2a" font-size="24" font-weight="800">1</text>
  <text x="860" y="212" text-anchor="middle" fill="#e0e1dd" font-size="15" font-weight="700">ثبّت التطبيق</text>
  <text x="860" y="234" text-anchor="middle" fill="#a9b4c2" font-size="12">APK من Releases أو بناء من المصدر</text>

  <!-- الخطوة 2: افتح المجلد وابدأ -->
  <circle cx="640" cy="150" r="34" fill="#778da9"/>
  <text x="640" y="160" text-anchor="middle" fill="#0d1b2a" font-size="24" font-weight="800">2</text>
  <text x="640" y="212" text-anchor="middle" fill="#e0e1dd" font-size="15" font-weight="700">افتح المجلد وابدأ</text>
  <text x="640" y="234" text-anchor="middle" fill="#a9b4c2" font-size="12">مستودع من مجلد موجود أو جديد — بلا تسجيل</text>

  <!-- الخطوة 3: أول commit -->
  <circle cx="420" cy="150" r="34" fill="#adb5bd"/>
  <text x="420" y="160" text-anchor="middle" fill="#0d1b2a" font-size="24" font-weight="800">3</text>
  <text x="420" y="212" text-anchor="middle" fill="#e0e1dd" font-size="15" font-weight="700">أول Commit بالعربية</text>
  <text x="420" y="234" text-anchor="middle" fill="#a9b4c2" font-size="12">تغييرات ← رسالة ← «احفظ» — مصطلحات مفهومة</text>

  <!-- الخطوة 4: استورد من GitHub (اختياري) -->
  <circle cx="200" cy="150" r="34" fill="#ced4da"/>
  <text x="200" y="160" text-anchor="middle" fill="#0d1b2a" font-size="24" font-weight="800">4</text>
  <text x="200" y="212" text-anchor="middle" fill="#e0e1dd" font-size="15" font-weight="700">استورد من GitHub (اختياري)</text>
  <text x="200" y="234" text-anchor="middle" fill="#a9b4c2" font-size="12">توكن شخصي يُحفظ على جهازك فقط</text>

  <text x="480" y="86" text-anchor="middle" fill="#a9b4c2" font-size="13">بلا حساب · بلا سحابة · الكود لا يترك جهازك</text>
</svg>
