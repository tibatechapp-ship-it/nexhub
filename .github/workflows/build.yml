name: Build

env:
  CMAKE_GENERATOR: "Visual Studio 17 2022"

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - run: flutter create --platforms=linux,windows,macos,android .
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos
      - name: Run tests
        run: flutter test --coverage

  build:
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: linux-x64
          - os: windows-latest
            target: windows
            artifact: windows-x64
          - os: macos-latest
            target: macos
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - run: flutter create --platforms=linux,windows,macos,android .
      - name: Fix Windows CMakeLists
        if: runner.os == 'Windows'
        run: |
          Get-Content windows/CMakeLists.txt | Select-String "Visual Studio"
          (Get-Content windows/CMakeLists.txt) -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022' | Set-Content windows/CMakeLists.txt
          Get-Content windows/CMakeLists.txt | Select-String "Visual Studio"
        shell: pwsh
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build
      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release
      - name: Build other
        if: matrix.target != 'macos'
        continue-on-error: true
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
        run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v7
        with:
          name: nexhub-${{ matrix.artifact }}
          path: build/${{ matrix.target }}/**/*

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - run: flutter create --platforms=linux,windows,macos,android .
      - name: Patch Kotlin version
        run: |
          if [ -f android/settings.gradle ]; then sed -i 's/1\.7\.10/1.9.22/g' android/settings.gradle; fi
          cat android/settings.gradle | grep -i kotlin || true
      - name: Patch gradle properties
        run: |
          echo 'android.useAndroidX=true' >> android/gradle.properties
          echo 'android.enableJetifier=true' >> android/gradle.properties
          echo 'android.nonTransitiveRClass=true' >> android/gradle.properties
          cat android/gradle.properties
      - name: Show AGP version
        run: |
          grep -rn 'com.android' android/settings.gradle 2>/dev/null || true
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter build apk --debug --split-per-abi
      - uses: actions/upload-artifact@v7
        with:
          name: nexhub-android
          path: build/app/outputs/flutter-apk/*.apk