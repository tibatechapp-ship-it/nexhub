name: nexhub
description: منصة Git محلية عربية للمطورين.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  xterm: ^4.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.3
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  file_picker: ^8.1.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.4
  http: ^1.2.2
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.2

flutter:
  uses-material-design: true
  generate: true